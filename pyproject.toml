[project]
name = "WaveMonitor"
dynamic = ["version"]
description = "A simple GUI for monitoring waveforms."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Qiujv", email = "qiujv@outlook.com" }]
dependencies = [
    "msgpack>=0.4.0",
    "msgpack_numpy",
    "numpy",
    "pyqtgraph",
    "PySide6>=6.7.0,!=6.9.1",
    "typing_extensions",
]

[project.urls]
Homepage = "https://github.com/Qiujv/WaveMonitor"

[project.gui-scripts]
start-wave-monitor = "wave_monitor.window:start"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/wave_monitor"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "LICENSE", "pyproject.toml"]

[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
    "jupyter>=1.1.1",
    "matplotlib>=3.9.4",
    "pytest>=8.4.2",
    "ruff>=0.12.9",
    "viztracer>=1.0.4",
]
